<header class="d-flex flex-md-row justify-content-between align-items-md-center gap-3 py-3 border-bottom">
  <div class="d-flex align-items-start gap-2">
    <button
      class="btn btn-outline-secondary btn-sm"
      type="button"
      (click)="onToggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="floating-menu"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      @if (menuOpen()) {
        <svg class="d-block" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      } @else {
        <svg class="d-block" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h16" />
          <path d="M4 6h16" />
          <path d="M4 18h16" />
        </svg>
      }
    </button>

    <div class="d-grid header-bootstrap-brand">
      <strong>{{ name() }}</strong>
      <span class="small text-body-secondary">{{ role() }}</span>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2" aria-label="Controles de apariencia">
    <button class="btn btn-outline-secondary btn-sm" type="button" (click)="onSwitchLayout()">
      {{ layoutMode() === 'bootstrap' ? 'Usar Tailwind' : 'Usar Bootstrap' }}
    </button>
    <button class="btn btn-outline-secondary btn-sm" type="button" (click)="onSwitchTheme()">
      {{ themeMode() === 'light' ? 'Dark' : 'Light' }}
    </button>
  </div>
</header>
