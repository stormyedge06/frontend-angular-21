<header class="tw-header flex gap-3 py-3 md:flex-row md:items-center md:justify-between">
  <div class="flex items-start gap-2">
    <button
      type="button"
      class="tw-btn rounded px-3 py-1 text-sm"
      (click)="onToggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="floating-menu"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      @if (menuOpen()) {
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      } @else {
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h16" />
          <path d="M4 6h16" />
          <path d="M4 18h16" />
        </svg>
      }
    </button>

    <div class="grid">
      <strong>{{ name() }}</strong>
      <span class="tw-role text-sm">{{ role() }}</span>
    </div>
  </div>

  <div class="flex flex-wrap gap-2" aria-label="Controles de apariencia">
    <button
      type="button"
      class="tw-btn rounded px-3 py-1 text-sm"
      (click)="onSwitchLayout()"
    >
      {{ layoutMode() === 'bootstrap' ? 'Usar Tailwind' : 'Usar Bootstrap' }}
    </button>
    <button
      type="button"
      class="tw-btn rounded px-3 py-1 text-sm"
      (click)="onSwitchTheme()"
    >
      {{ themeMode() === 'light' ? 'Dark' : 'Light' }}
    </button>
  </div>
</header>
