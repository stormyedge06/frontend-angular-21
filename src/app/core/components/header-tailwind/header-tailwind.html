<header class="tw-header flex flex-col gap-3 py-3 md:flex-row md:items-center md:justify-between">
  <div class="grid">
    <strong>{{ name() }}</strong>
    <span class="tw-role text-sm">{{ role() }}</span>
  </div>

  <div class="flex flex-wrap gap-2" aria-label="Controles de apariencia">
    <button
      type="button"
      class="tw-btn rounded px-3 py-1 text-sm"
      (click)="onSwitchLayout()"
    >
      {{ layoutMode() === 'bootstrap' ? 'Usar Tailwind' : 'Usar Bootstrap' }}
    </button>
    <button
      type="button"
      class="tw-btn rounded px-3 py-1 text-sm"
      (click)="onSwitchTheme()"
    >
      {{ themeMode() === 'light' ? 'Dark' : 'Light' }}
    </button>
  </div>
</header>
