<div class="shell-bs">
	<aside class="shell-bs__sidebar" aria-label="Sidebar">
		<mat-toolbar class="shell-bs__sidebar-title">Menu</mat-toolbar>

		<nav class="shell-bs__menu" aria-label="Navegación lateral">
			<ul role="list">
				<li><button mat-button type="button" disabled>Inicio</button></li>
				<li><button mat-button type="button" disabled>Sobre mí</button></li>
				<li><button mat-button type="button" disabled>Proyectos</button></li>
				<li><button mat-button type="button" disabled>Contacto</button></li>
			</ul>
		</nav>

		<div class="shell-bs__switch">
			<button mat-button type="button" (click)="onSwitchLayout()">Usar Tailwind</button>
		</div>
	</aside>

	<section class="shell-bs__body" aria-label="Body">
		<header class="shell-bs__header">
			<app-header-bootstrap [name]="name()" [role]="role()"></app-header-bootstrap>
		</header>

		<main class="shell-bs__content" aria-label="Content">
			<!-- <ng-content></ng-content> -->
		</main>

		<footer class="shell-bs__footer">
			<app-footer-bootstrap [name]="name()"></app-footer-bootstrap>
		</footer>
	</section>
</div>
