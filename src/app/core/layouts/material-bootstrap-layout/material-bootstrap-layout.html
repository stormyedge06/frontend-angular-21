<div class="shell-bs">
	@if (menuOpen()) {
		<button class="shell-bs__backdrop" type="button" aria-label="Cerrar menú" (click)="onCloseMenu()"></button>
	}

	<aside
		id="floating-menu"
		class="shell-bs__sidebar"
		aria-label="Sidebar"
		[class.shell-bs__sidebar--open]="menuOpen()"
	>
		<app-menu-bootstrap />
	</aside>

	<section class="shell-bs__body" aria-label="Body">
		<header class="shell-bs__header">
			<app-header-bootstrap
				[name]="name()"
				[role]="role()"
				[menuOpen]="menuOpen()"
				[layoutMode]="layoutMode()"
				[themeMode]="themeMode()"
				(toggleMenu)="onToggleMenu()"
				(switchLayout)="onSwitchLayout()"
				(switchTheme)="onSwitchTheme()"
			></app-header-bootstrap>
		</header>

		<main class="shell-bs__content" aria-label="Content">
			<!-- <ng-content></ng-content> -->
       <app-menu-design></app-menu-design>
		</main>

		<footer class="shell-bs__footer">
			<app-footer-bootstrap [name]="name()"></app-footer-bootstrap>
		</footer>
	</section>
</div>
