<div class="shell-tw">
	@if (menuOpen()) {
		<button class="shell-tw__backdrop" type="button" aria-label="Cerrar menú" (click)="onCloseMenu()"></button>
	}

	<aside
		id="floating-menu"
		class="shell-tw__sidebar"
		aria-label="Sidebar"
		[class.shell-tw__sidebar--open]="menuOpen()"
	>
		<app-menu-tailwind></app-menu-tailwind>
	</aside>

	<section class="shell-tw__body" aria-label="Body">
		<header class="shell-tw__header">
			<app-header-tailwind
				[name]="name()"
				[role]="role()"
				[menuOpen]="menuOpen()"
				[layoutMode]="layoutMode()"
				[themeMode]="themeMode()"
				(toggleMenu)="onToggleMenu()"
				(switchLayout)="onSwitchLayout()"
				(switchTheme)="onSwitchTheme()"
			/>
		</header>

		<main class="shell-tw__content" aria-label="Content">
			<ng-content></ng-content>
		</main>

		<footer class="shell-tw__footer">
			<app-footer-tailwind [name]="name()" />
		</footer>
	</section>
</div>
