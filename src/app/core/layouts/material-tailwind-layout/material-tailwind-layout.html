<div class="shell-tw">
	<aside class="shell-tw__sidebar" aria-label="Sidebar">
		<mat-toolbar class="shell-tw__sidebar-title">Menu</mat-toolbar>

		<nav class="shell-tw__menu" aria-label="Navegación lateral">
			<ul role="list">
				<li><button mat-button type="button" disabled>Inicio</button></li>
				<li><button mat-button type="button" disabled>Sobre mí</button></li>
				<li><button mat-button type="button" disabled>Proyectos</button></li>
				<li><button mat-button type="button" disabled>Contacto</button></li>
			</ul>
		</nav>
	</aside>

	<section class="shell-tw__body" aria-label="Body">
		<header class="shell-tw__header">
			<app-header-tailwind
				[name]="name()"
				[role]="role()"
				[layoutMode]="layoutMode()"
				[themeMode]="themeMode()"
				(switchLayout)="onSwitchLayout()"
				(switchTheme)="onSwitchTheme()"
			/>
		</header>

		<main class="shell-tw__content" aria-label="Content">
			<!-- <ng-content /> -->
		</main>

		<footer class="shell-tw__footer">
			<app-footer-tailwind [name]="name()" />
		</footer>
	</section>
</div>
