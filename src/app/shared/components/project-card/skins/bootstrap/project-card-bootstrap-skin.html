<article class="project card h-100 border-0 shadow-sm rounded-4">
  <div class="card-body d-grid gap-3">
    <h3 class="h5 m-0">{{ project().name }}</h3>
    <p class="m-0">{{ project().summary }}</p>

    <ul class="d-flex flex-wrap gap-2 list-unstyled m-0 p-0" role="list">
      @for (tech of project().stack; track tech) {
        <li class="badge rounded-pill text-bg-light border">{{ tech }}</li>
      }
    </ul>

    <div class="d-flex gap-2 flex-wrap mt-1">
      <a class="btn btn-outline-primary btn-sm" [href]="project().demoUrl" target="_blank" rel="noreferrer">
        Demo
      </a>
      <a class="btn btn-outline-secondary btn-sm" [href]="project().repoUrl" target="_blank" rel="noreferrer">
        Repositorio
      </a>
    </div>
  </div>
</article>
